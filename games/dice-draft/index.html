<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0B22" />
  <title>Dice game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- background: a dim spotlight from above -->
  <div class="pips" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="app">
    <!-- MENU -->
    <section id="menu" class="screen">
      <div class="audio-switches">
        <button class="audio-btn music-btn" aria-label="Music"></button>
        <button class="audio-btn sound-btn" aria-label="Sound"></button>
      </div>
      <div class="hero"><img src="assets/mascot/bones-menu.png" alt="Bones the dog in dark glasses, chewing a toothpick" /></div>
      <i class="play-ring" aria-hidden="true"></i>
      <button id="play-btn" class="play-tag">Play</button>
      <h1 id="title"></h1>
      <div class="menu-actions">
        <div class="pair">
          <button id="howto-btn" class="outline">How to play</button>
          <button id="tutorial-btn" class="outline">Tutorial</button>
        </div>
      </div>
    </section>

    <!-- SETUP -->
    <section id="setup" class="screen hidden">
      <button id="back-btn" class="quiet back">Back</button>
      <h2>Pick a rival</h2>
      <div id="bot-list" class="options"></div>
      <div class="controls">
        <button id="start-btn" class="primary">Start match</button>
      </div>
    </section>

    <!-- PLAY -->
    <section id="play" class="screen hidden">
      <div class="stage"><canvas id="table" width="720" height="640" tabindex="0" aria-label="Dice table"></canvas></div>
      <p id="live" class="sr-only" aria-live="polite"></p>
      <div id="hud">
        <div id="powers"></div>
        <div class="hud-row">
          <div id="facts"></div>
          <button class="audio-btn music-btn small" aria-label="Music"></button>
          <button class="audio-btn sound-btn small" aria-label="Sound"></button>
          <button id="skip-btn" class="small hidden">Skip</button>
          <button id="quit-btn" class="small quiet">Leave</button>
        </div>
      </div>
    </section>

    <!-- END -->
    <section id="end" class="screen hidden">
      <div id="result" class="result"></div>
      <div id="log" class="panel"></div>
      <p id="audit" class="audit"></p>
      <div class="controls">
        <button id="rematch-btn" class="primary">Play again</button>
        <button id="menu-btn" class="outline">Change rival</button>
      </div>
    </section>
  </div>

  <dialog id="howto-dialog" aria-labelledby="howto-title">
    <h2 id="howto-title">How to play</h2>
    <div id="howto-body"></div>
    <form method="dialog"><button class="primary">Got it</button></form>
  </dialog>

  <dialog id="tutorial-dialog" aria-labelledby="tutorial-title">
    <h2 id="tutorial-title">Tutorial</h2>
    <p>The guided tutorial isn't ready yet. How to play covers the rules in six short steps.</p>
    <form method="dialog"><button class="primary">Close</button></form>
  </dialog>

  <!-- No build step: bare imports resolve to pinned CDN builds. -->
  <script type="importmap">
    {
      "imports": {
        "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.min.js"
      }
    }
  </script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
